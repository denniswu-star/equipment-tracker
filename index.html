<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">

<title>儀器借用系統</title>

<style>

body{
  font-family: Arial;
  max-width:600px;
  margin:auto;
  padding:20px;
}

.card{
  border:1px solid #ddd;
  border-radius:10px;
  padding:20px;
}

input{
  width:100%;
  padding:10px;
  margin-top:10px;
}

button{
  width:100%;
  padding:10px;
  margin-top:10px;
  background:#0078d4;
  color:white;
  border:none;
  border-radius:5px;
}

</style>

</head>

<body>

<div class="card">

<h2>儀器借用系統</h2>

<h3>設備：EQ001 示波器</h3>

<input
id="emp"
placeholder="輸入工號">

<button onclick="borrow()">
借出
</button>

</div>

<script>

function borrow(){

let emp=
document.getElementById('emp').value;

if(emp==""){
alert("請輸入工號");
return;
}

alert("借出成功\n工號："+emp);

}

</script>

</body>
</html>
