<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <title>儀借用狀態</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; text-align: center; padding: 30px; background: #f7f9fc; }
    table { margin: 0 auto; border-collapse: collapse; width: 80%; }
    th, td { border: 1px solid #ccc; padding: 10px; text-align: center; }
    th { background: #498db; color: white; }
    .available { color: green; font-weight: bold; }
    .loaned { color: red; font-weight: bold; }
  </style>
</head>
<body>
  <h1>儀器借用狀態</h1>
  <table>
    <tr>
      <th>儀器名稱</th>
      <th>狀態</th>
      <th>借用者</th>
      <th>借用日期</th>
      <th>歸還日期    </tr>
    <tr>
      <td>示波器</td>
      <td class="loaned">借用中</td>
      <td>張三</td>
      <td>2025-04-05</td>
      <td>2025-04-10</td>
    </tr>
    <tr>
      <td>頻譜分析儀</td>
      <td class="available">可借用</td>
      <td>-</td>
      <td>-</td>
      <td>-</td>
    </tr>
  </table>
</body>
</html>
